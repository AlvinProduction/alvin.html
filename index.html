<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVIN PRODUCTION</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #0b0b0e; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff; }
        #start-screen { text-align: center; z-index: 10; transition: opacity 0.5s ease; }
        h1 { font-size: 4rem; font-weight: 900; letter-spacing: 4px; color: #ff0055; text-shadow: 0 0 20px rgba(255, 0, 85, 0.6); margin-bottom: 10px; text-transform: uppercase; }
        p { font-size: 1.2rem; color: #8888aa; margin-bottom: 40px; letter-spacing: 2px; }
        .play-btn { background: #ff0055; color: white; border: none; font-size: 2.5rem; font-weight: bold; padding: 25px 70px; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px rgba(255, 0, 85, 0.8); transition: transform 0.2s, background 0.2s; text-transform: uppercase; }
        .play-btn:hover { transform: scale(1.08); background: #ff1a66; }
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 20; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Alvin Production</h1>
        <p>Bist du bereit? Drück auf Play.</p>
        <button class="play-btn" onclick="startVideo()">PLAY</button>
    </div>

    <div id="video-container">
        <video id="my-video" controls>
            <!-- Name ist jetzt perfekt auf alvin.mp4 eingestellt -->
            <source src="alvin.mp4" type="video/mp4">
            Dein Browser unterstützt dieses Video leider nicht.
        </video>
    </div>

    <script>
        function startVideo() {
            const video = document.getElementById('my-video');
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('video-container').style.display = 'block';
                video.play();
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            }, 300);
        }
    </script>
</body>
</html>
